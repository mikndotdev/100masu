name: Build & push realtime image
on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "apps/realtime/**"
      - "packages/db/**"
      - "packages/env/**"
      - "docker/realtime.Dockerfile"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/build-realtime.yml"

jobs:
  build-amd64:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (AMD64)
        uses: useblacksmith/build-push-action@v2
        with:
          platforms: linux/amd64
          context: .
          file: docker/realtime.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-realtime:latest-amd
            ghcr.io/${{ github.repository }}-realtime:${{ github.sha }}-amd

  build-arm64:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (ARM64)
        uses: useblacksmith/build-push-action@v2
        with:
          platforms: linux/arm64
          context: .
          file: docker/realtime.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-realtime:latest-arm
            ghcr.io/${{ github.repository }}-realtime:${{ github.sha }}-arm

  build-merge:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}-realtime:latest \
              ghcr.io/${{ github.repository }}-realtime:latest-amd \
              ghcr.io/${{ github.repository }}-realtime:latest-arm
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}-realtime:${{ github.sha }} \
              ghcr.io/${{ github.repository }}-realtime:${{ github.sha }}-amd \
              ghcr.io/${{ github.repository }}-realtime:${{ github.sha }}-arm
